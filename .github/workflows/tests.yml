name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. quick successive pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          # Two workspaces, two lockfiles — key the cache off both.
          cache-dependency-path: |
            pnpm-lock.yaml
            bootstrap/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bootstrap dependencies
        run: pnpm install --frozen-lockfile
        working-directory: bootstrap

      # `lib/` is gitignored: esbuild + tsc must run before tests (e2e invokes the
      # built `kubik` bin). Invoke kubik directly rather than `pnpm build`, whose
      # `./build.mjs` relies on a shebang that doesn't run on native Windows.
      - name: Build
        run: pnpm exec kubik build.mjs
        working-directory: bootstrap

      - name: Run tests
        run: pnpm test

